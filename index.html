<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2f6b4f">
  <meta name="description" content="Acceso al fichaje de personal de Cerro Aventura">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Fichaje Cerro Aventura</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#eef4f0;color:#1f2b25;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(440px,100%);background:white;border-radius:22px;padding:28px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.12)}
    img{width:180px;height:180px;object-fit:contain;border-radius:24px}
    h1{font-size:24px;margin:18px 0 6px}
    p{margin:0 0 22px;color:#526158;line-height:1.45}
    a{display:block;text-decoration:none;background:#2f6b4f;color:white;padding:16px 18px;border-radius:12px;font-weight:700;font-size:17px}
    small{display:block;margin-top:18px;color:#718078}
  </style>
</head>
<body>
  <main class="card">
    <img src="./icon-512.png" alt="Cerro Aventura">
    <h1>Fichaje Cerro Aventura</h1>
    <p>Acceso al sistema oficial de fichaje de personal.</p>
    <a href="https://script.google.com/macros/s/AKfycbwffD7IzOu0DASpHx2nK9RcIrB-u_IGkbvU-q8GNfOL2dkcpLWp6X2Akmfk9B2QIj6x/exec">ABRIR FICHAJE</a>
    <small>Cerro Aventura · Tandil</small>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
